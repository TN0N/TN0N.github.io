<!DOCTYPE html>
<html>
<head>
  <title>Login</title>
</head>
<body>

<h2>Login</h2>

<input id="email" type="email" placeholder="Email"><br><br>
<input id="password" type="password" placeholder="Password"><br><br>

<button onclick="login()">Login</button>
<button onclick="signup()">Sign Up</button>

<p id="error"></p>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import {
    getAuth,
    signInWithEmailAndPassword,
    createUserWithEmailAndPassword
  } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
    apiKey: "AIzaSyBoWv63ViMLw_68DHYf-AOcCbKEj2VbVdc",
    authDomain: "bbotvids.firebaseapp.com",
    projectId: "bbotvids",
    storageBucket: "bbotvids.firebasestorage.app",
    messagingSenderId: "852311482336",
    appId: "1:852311482336:web:38aa629989dfea4bf4d585"
    };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  window.login = function () {
    signInWithEmailAndPassword(
      auth,
      email.value,
      password.value
    )
    .then(() => window.location.href = "./html/index.html")
    .catch(err => error.innerText = err.message);
  };

  window.signup = function () {
    createUserWithEmailAndPassword(
      auth,
      email.value,
      password.value
    )
    .then(() => window.location.href = "./html/index.html")
    .catch(err => error.innerText = err.message);
  };
</script>

</body>
</html>
