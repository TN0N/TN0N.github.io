<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Video Player</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f0f0f;
      color: #eee;
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 30px 16px;
      gap: 20px;
    }
    h1 { font-size: 1.2rem; color: #aaa; font-weight: 400; }
    .input-row {
      display: flex;
      width: 100%;
      max-width: 860px;
      gap: 10px;
    }
    input[type="text"] {
      flex: 1;
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #1a1a1a;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }
    input[type="text"]:focus { border-color: #555; }
    button {
      padding: 12px 22px;
      background: #2e7dff;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      cursor: pointer;
      white-space: nowrap;
    }
    button:hover { background: #1a6bf0; }
    button:disabled { background: #444; cursor: not-allowed; }
    video {
      width: 100%;
      max-width: 860px;
      border-radius: 10px;
      background: #000;
      display: none;
    }
    #error {
      color: #ff6b6b;
      font-size: 0.9rem;
      display: none;
      max-width: 860px;
      text-align: center;
    }
    #tokenOutput {
      font-size: 0.8rem;
      color: #6bf;
      max-width: 860px;
      word-break: break-all;
      text-align: center;
      display: none;
    }
    .hint {
      font-size: 0.8rem;
      color: #555;
      max-width: 860px;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>🎬 Local Video Player</h1>

  <div class="input-row">
    <input type="text" id="urlInput" placeholder="Paste your video URL here..." />
    <button onclick="playVideo()">Play</button>
  </div>
  <video id="player" controls autoplay></video>
  <div id="error">⚠️ Could not load video. The server may be blocking playback or the URL has expired.</div>

  <div class="input-row" style="justify-content: center;">
    <button id="tokenBtn" onclick="fetchToken()">🔑 Get Access Token</button>
  </div>
  <div id="tokenOutput"></div>

  <p class="hint">Uses a native &lt;video&gt; tag — works with direct MP4 URLs even when other online players fail due to CORS.</p>

  <script>
    const input = document.getElementById('urlInput');
    const player = document.getElementById('player');
    const error = document.getElementById('error');
    const tokenBtn = document.getElementById('tokenBtn');
    const tokenOutput = document.getElementById('tokenOutput');

    // Allow pressing Enter to play
    input.addEventListener('keydown', e => { if (e.key === 'Enter') playVideo(); });

    function playVideo() {
      const url = input.value.trim();
      if (!url) return;
      error.style.display = 'none';
      player.style.display = 'block';
      player.src = url;
      player.load();
      player.play().catch(() => {});
    }

    player.addEventListener('error', () => {
      player.style.display = 'none';
      error.style.display = 'block';
    });

    // Degoo token fetcher
    const DEGOO_URL = "https://rest-api.degoo.com/access-token/v2";

    async function getToken() {
      const headers = {
        "content-type": "application/json",
        "x-api-authentication": "zIDZwkjMzIDN3MjYtYGZhlTL2QWY00CNlZWZtgzY5QDN3MjY",
        "User-Agent": "Mozilla/5.0",
        "Referer": "https://app.degoo.com/",
      };
      const payload = {
        RefreshToken: "wEeGfv..9cjbMUuldwuS6ydwCTgSrt0agCNsJM70axtIpaZt7G1uFh38dui3ewIRVrCR4ZK7aWmJg2MNunKrxw",
      };

      const response = await fetch(DEGOO_URL, {
        method: "POST",
        headers,
        body: JSON.stringify(payload),
        signal: AbortSignal.timeout(30000),
      });

      const responseData = await response.json();
      return responseData.AccessToken;
    }

    async function fetchToken() {
      tokenBtn.disabled = true;
      tokenBtn.textContent = "Fetching…";
      tokenOutput.style.display = "none";

      try {
        const token = await getToken();
        tokenOutput.style.display = "block";
        tokenOutput.textContent = "✅ AccessToken: " + token;
      } catch (err) {
        tokenOutput.style.display = "block";
        tokenOutput.style.color = "#ff6b6b";
        tokenOutput.textContent = "❌ Failed to fetch token: " + err.message;
      } finally {
        tokenBtn.disabled = false;
        tokenBtn.textContent = "🔑 Get Access Token";
      }
    }
  </script>
</body>
</html>
