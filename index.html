<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Video Player</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f0f0f;
      color: #eee;
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 30px 16px;
      gap: 20px;
    }
    h1 { font-size: 1.2rem; color: #aaa; font-weight: 400; }
    .input-row {
      display: flex;
      width: 100%;
      max-width: 860px;
      gap: 10px;
    }
    input[type="text"] {
      flex: 1;
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #1a1a1a;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }
    input[type="text"]:focus { border-color: #555; }
    button {
      padding: 12px 22px;
      background: #2e7dff;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      cursor: pointer;
      white-space: nowrap;
    }
    button:hover { background: #1a6bf0; }
    button:disabled { background: #444; cursor: not-allowed; }
    video {
      width: 100%;
      max-width: 860px;
      border-radius: 10px;
      background: #000;
      display: none;
    }
    #error {
      color: #ff6b6b;
      font-size: 0.9rem;
      display: none;
      max-width: 860px;
      text-align: center;
    }
    #tokenOutput {
      font-size: 0.8rem;
      color: #6bf;
      max-width: 860px;
      word-break: break-all;
      text-align: center;
      display: none;
    }
    .hint {
      font-size: 0.8rem;
      color: #555;
      max-width: 860px;
      text-align: center;
    }
    .videoListing
    {
        display: block;
        width: 500px;
        height: 300px;
        object-fit: cover;
    }
    .videoListing
    {
        display: block;
        width: 500px;
        height: 300px;
        object-fit: cover;
    }
    .videoListing:hover
    {
      background-color: #4338ca;
      transform: scale(1.05);
    }
  </style>
  <script src="build_page.js"></script>
</head>
  <body>
    <h1>🎬 Local Video Player</h1>
      <div class="input-row">
        <button onclick="shiftLeft()">LEFT</button>
        <button onclick="shiftRight()">RIGHT</button>
      </div>
    <video id="player" controls autoplay></video>
    <div id="error">⚠️ Could not load video. The server may be blocking playback or the URL has expired.</div>
  </body>
</html>
