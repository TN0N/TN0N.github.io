<!DOCTYPE html>
<html>
<head>
  <title>Dashboard</title>
</head>
<body>

<h2>Dashboard</h2>
<button onclick="logout()">Logout</button>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import {
    getAuth,
    onAuthStateChanged,
    signOut
  } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

  const firebaseConfig = {
  apiKey: "AIzaSyBoWv63ViMLw_68DHYf-AOcCbKEj2VbVdc",
  authDomain: "bbotvids.firebaseapp.com",
  projectId: "bbotvids",
  storageBucket: "bbotvids.firebasestorage.app",
  messagingSenderId: "852311482336",
  appId: "1:852311482336:web:38aa629989dfea4bf4d585"
};

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  onAuthStateChanged(auth, user => {
    if (!user) {
      window.location.href = "index.html";
    }
  });

  window.logout = function () {
    signOut(auth).then(() => {
      window.location.href = "index.html";
    });
  };
</script>

</body>
</html>
